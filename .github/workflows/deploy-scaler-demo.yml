name: Deploy Scaler demo to maimons.dev

on:
  push:
    branches:
      - main
    paths:
      - 'scaler-demo/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-scaler-demo.yml'
  workflow_dispatch:

concurrency:
  group: deploy-scaler-demo
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: maimons.dev
  S3_PREFIX: scaler

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter scaler-demo...

      - name: Build demo
        run: pnpm --filter scaler-demo build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload versioned assets
        run: |
          aws s3 sync scaler-demo/dist/assets "s3://${S3_BUCKET}/${S3_PREFIX}/assets/" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --only-show-errors

      - name: Upload static files
        run: |
          aws s3 sync scaler-demo/dist "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --exclude index.html \
            --exclude 'assets/*' \
            --cache-control 'public,max-age=3600' \
            --only-show-errors

      - name: Upload HTML entry point
        run: |
          aws s3 cp scaler-demo/dist/index.html "s3://${S3_BUCKET}/${S3_PREFIX}/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --only-show-errors

      - name: Publish deployment URL
        run: echo "### Deployed to https://maimons.dev/${S3_PREFIX}/" >> "$GITHUB_STEP_SUMMARY"
