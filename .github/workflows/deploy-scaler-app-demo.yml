name: Deploy Scaler demo to maimons.dev

# Publishes the real Scaler app's dashboard as a static site — no backend of
# any kind is reachable from this build. The dashboard runs entirely on mock
# data (see app/page.tsx and lib/demo-data.ts); the "Create a trigger-reader
# role" panel only ever produces copy-pasteable commands, never a live call.
# The controller/, deploy/, and scripts/ directories (the real events API,
# reconciler, Helm chart, and CloudFormation role template — everything used
# for an actual self-hosted deployment) are not part of this build at all.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'hooks/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.openai/**'
      - '.github/workflows/deploy-scaler-app-demo.yml'
  workflow_dispatch:

concurrency:
  group: deploy-scaler-app-demo
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: www.maimons.dev
  S3_PREFIX: scaler

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static demo
        run: npm run build:static-demo

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload static assets
        # assetPrefix (see next.config.ts) puts hashed assets under a
        # dist/client/scaler/_next/ subfolder, not dist/client/_next/ --
        # required so their URLs resolve correctly once served from /scaler/.
        run: |
          aws s3 sync dist/client/scaler/_next "s3://${S3_BUCKET}/${S3_PREFIX}/_next/" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --only-show-errors

      - name: Upload other static files
        run: |
          aws s3 cp dist/client/favicon.svg "s3://${S3_BUCKET}/${S3_PREFIX}/favicon.svg" \
            --cache-control 'public,max-age=3600' \
            --only-show-errors
          aws s3 cp dist/client/404.html "s3://${S3_BUCKET}/${S3_PREFIX}/404.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public,max-age=3600' \
            --only-show-errors

      - name: Upload HTML entry point
        run: |
          aws s3 cp dist/client/index.html "s3://${S3_BUCKET}/${S3_PREFIX}/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache,max-age=0,must-revalidate' \
            --only-show-errors

      - name: Publish deployment URL
        run: echo "### Deployed to https://maimons.dev/${S3_PREFIX}/" >> "$GITHUB_STEP_SUMMARY"
